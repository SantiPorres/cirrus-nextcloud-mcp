version: "2"

linters:
  default: standard
  enable:
    - bodyclose
    - errorlint
    - gocritic
    - gosec
    - misspell
    - noctx
    - revive
    - unconvert
    - unparam
  settings:
    gosec:
      excludes:
        - G104 # unhandled errors are covered by errcheck
        - G304 # no file paths come from users; files live in Nextcloud
    revive:
      rules:
        - name: exported
        - name: package-comments
        - name: unused-parameter
  exclusions:
    rules:
      - path: _test\.go
        linters: [gosec, noctx, bodyclose, unparam]
      - path: internal/testutil/
        linters: [gosec, noctx]

formatters:
  enable:
    - gofmt
    - goimports
  settings:
    goimports:
      local-prefixes:
        - github.com/SantiPorres/cirrus-nextcloud-mcp
