name: CI

on:
  push:
    branches: [main, dev]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - name: go mod tidy leaves no changes
        run: go mod tidy && git diff --exit-code -- go.mod go.sum
      - uses: golangci/golangci-lint-action@d583c34f0599d37dbac4a198b9c83201be380893 # v9.3.0
        with:
          version: v2.15.0

  test:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - name: Install pdftoppm (for the PDF rendering tests)
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends poppler-utils
      - run: go vet ./...
      - run: go test -race -count=1 ./...
      - name: Build
        run: make build
      - name: Vulnerability check
        run: make vuln

  integration:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - name: Install pdftoppm (for the PDF rendering tests)
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends poppler-utils
      - name: Start Nextcloud
        run: make integration-up
      - name: Integration tests
        run: go test -tags integration -count=1 ./test/integration/...
      - name: Nextcloud logs
        if: failure()
        run: docker compose -f test/integration/docker-compose.test.yml logs --tail 200
